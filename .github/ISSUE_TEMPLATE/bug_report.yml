name: Bug report
description: Something isn't working right
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
      placeholder: The corgi fell through a line of code instead of standing on it.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      description: Steps, and if possible a small snippet of the code the pet was on.
      placeholder: |
        1. Add a corgi
        2. Open a file with ...
        3. Scroll to ...
  - type: input
    id: pet
    attributes:
      label: Which pet(s)?
      placeholder: Corgi, Orange Cat
  - type: input
    id: vscode
    attributes:
      label: VS Code version
      description: Help › About
      placeholder: "1.105.0"
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
  - type: textarea
    id: settings
    attributes:
      label: Relevant settings
      description: Anything non-default, e.g. word wrap, line height, font size, or any `pettingZoo.*` settings.
  - type: textarea
    id: media
    attributes:
      label: Screenshot or recording
      description: Drag an image or video in here if you have one.
